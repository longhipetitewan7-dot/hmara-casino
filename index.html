
<script>
const HMARA_API = "https://hmara-casinofr.onrender.com";
let hmaraDiscordUser = null;

async function hmaraRequest(path, options = {}) {
  const response = await fetch(HMARA_API + path, {
    ...options,
    credentials: "include",
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || "Erreur de communication avec le serveur.");
  }

  return data;
}

function hmaraSetBalance(data) {
  if (Number.isSafeInteger(data.balance)) coins = data.balance;
  if (Number.isSafeInteger(data.wins)) wins = data.wins;
  if (Number.isSafeInteger(data.played)) played = data.played;

  // Le solde connecté vient du serveur, pas du stockage local.
  render();
  updateBonus();
}

async function hmaraSync() {
  try {
    const data = await hmaraRequest("/api/me");

    hmaraDiscordUser = data.user || null;

    if (hmaraDiscordUser) {
      username = hmaraDiscordUser.username;
      coins = hmaraDiscordUser.coins;
      wins = hmaraDiscordUser.wins;
      played = hmaraDiscordUser.played;

      $("username").textContent = username;
      $("profileCaption").textContent = "Connecté avec Discord";

      const avatar = $("avatar");
      if (hmaraDiscordUser.avatar) {
        avatar.innerHTML =
          '<img src="' + esc(hmaraDiscordUser.avatar) +
          '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">';
      } else {
        avatar.textContent = "♙";
      }

      try {
        const board = await hmaraRequest("/api/leaderboard");
        localStorage.setItem(
          "hm3players",
          JSON.stringify(
            (board.players || [])
              .filter(p => p.id !== hmaraDiscordUser.id)
              .map(p => ({
                name: p.username,
                coins: p.coins,
                wins: p.wins,
                played: p.played,
                score: p.score
              }))
          )
        );
      } catch (error) {
        console.warn("Classement indisponible :", error.message);
      }

      render();
    }

    const params = new URLSearchParams(location.search);
    if (params.get("discord") === "connected") {
      history.replaceState({}, "", location.pathname);
      toast("Connexion Discord réussie !", "good");
    } else if (params.get("discord") === "cancelled") {
      history.replaceState({}, "", location.pathname);
      toast("Connexion Discord annulée.", "bad");
    }
  } catch (error) {
    console.error("Synchronisation HMARA :", error);
  }
}

// Le bouton Discord lance désormais OAuth.
const hmaraOriginalOpenModal = openModal;
openModal = function(type) {
  if (type === "discord") {
    window.location.href = HMARA_API + "/auth/discord";
    return;
  }

  hmaraOriginalOpenModal(type);

  if (type === "profile" && hmaraDiscordUser) {
    $("modalTitle").textContent = "VOTRE ESPACE DISCORD";
    $("modalBody").innerHTML = `
      <div style="text-align:center;padding:10px">
        <div style="font-size:18px;font-weight:800">
          ${esc(hmaraDiscordUser.username)}
        </div>
        <p class="muted">Compte Discord authentifié</p>
      </div>
      <div class="statrow"><span>Jetons partagés</span>
        <b class="gold">${fmt(coins)} ✦</b></div>
      <div class="statrow"><span>Parties jouées</span><b>${played}</b></div>
      <div class="statrow"><span>Victoires</span><b>${wins}</b></div>
    `;
    $("modalActions").innerHTML = `
      <button class="secondary" onclick="closeModal()">Fermer</button>
      <button onclick="hmaraLogout()">Se déconnecter</button>
    `;
  }
};

async function hmaraLogout() {
  try {
    await hmaraRequest("/auth/logout", { method: "POST" });
    location.reload();
  } catch (error) {
    toast(error.message, "bad");
  }
}

// Résultats visuels des jeux : les valeurs proviennent du serveur.
function hmaraShowGame(data) {
  const g = data.game;
  openModal(g);

  const result = data.result || {};
  const balanceText = "Solde : " + fmt(data.balance) + " jetons";

  if (g === "slots") {
    (result.symbols || []).forEach((symbol, i) => {
      const reel = $("reel" + i);
      if (reel) reel.textContent = symbol;
    });
    $("slotResult").textContent = data.message;
    $("slotBalance").textContent = balanceText;
  }

  if (g === "roulette") {
    $("rouletteResult").textContent = data.message;
    $("rouletteBalance").textContent = balanceText;
    $("wheel").style.transform =
      "rotate(" + (1440 + (result.number || 0) * (360 / 37)) + "deg)";
  }

  if (g === "dice") {
    const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
    if (result.dice) {
      $("die1").textContent = faces[result.dice[0] - 1];
      $("die2").textContent = faces[result.dice[1] - 1];
    }
    $("diceResult").textContent = data.message;
    $("diceBalance").textContent = balanceText;
  }

  if (g === "coin") {
    $("coinart").textContent = result.side || "HM";
    $("coinResult").textContent = data.message;
    $("coinBalance").textContent = balanceText;
  }

  if (g === "blackjack") {
    $("playerCards").innerHTML = (result.player || [])
      .map(n => card(n)).join("");
    $("dealerCards").innerHTML = (result.dealer || [])
      .map(n => card(n)).join("");
    $("blackjackResult").textContent = data.message;
    $("blackjackBalance").textContent = balanceText;
  }

  toast(data.won ? "Partie gagnante !" : "Partie terminée.", data.won ? "good" : "");
}

// Remplace le calcul local des parties par l'API sécurisée.
startGame = async function() {
  const input = $("setupBet");
  if (input) setBet(input.value);

  if (!hmaraDiscordUser) {
    toast("Connecte-toi avec Discord pour jouer avec un solde partagé.", "bad");
    return;
  }

  if (!Number.isSafeInteger(selectedBet) ||
      selectedBet < 1 ||
      selectedBet > coins) {
    toast("Mise invalide ou solde insuffisant.", "bad");
    return;
  }

  const game = lastGame;

  try {
    const data = await hmaraRequest("/api/game", {
      method: "POST",
      body: JSON.stringify({ game, bet: selectedBet })
    });

    hmaraSetBalance(data);
    hmaraShowGame(data);
  } catch (error) {
    toast(error.message, "bad");
  }
};

// Bonus partagé et vérifié par le serveur.
claimBonus = async function() {
  if (!hmaraDiscordUser) {
    toast("Connecte-toi avec Discord pour réclamer le bonus.", "bad");
    return;
  }

  try {
    const data = await hmaraRequest("/api/bonus", { method: "POST" });
    coins = data.balance;
    render();
    updateBonus();
    toast("Bonus récupéré : +" + data.bonus + " jetons !", "good");
  } catch (error) {
    toast(error.message, "bad");
    updateBonus();
  }
};

// Achat enregistré dans la base de données.
confirmBuy = async function() {
  if (!purchase) return;

  if (!hmaraDiscordUser) {
    toast("Connecte-toi avec Discord pour acheter.", "bad");
    return;
  }

  const item = purchase.name;

  try {
    const data = await hmaraRequest("/api/shop", {
      method: "POST",
      body: JSON.stringify({ name: item })
    });

    coins = data.balance;
    purchase = null;
    render();
    closeModal();
    toast(data.message, "good");
  } catch (error) {
    toast(error.message, "bad");
  }
};

// Le classement partagé est récupéré au moment de l'ouverture.
const hmaraOpenModalAfterSync = openModal;
openModal = function(type) {
  hmaraOpenModalAfterSync(type);

  if (type === "leaderboard" && hmaraDiscordUser) {
    hmaraRequest("/api/leaderboard")
      .then(data => {
        localStorage.setItem(
          "hm3players",
          JSON.stringify(
            (data.players || [])
              .filter(p => p.id !== hmaraDiscordUser.id)
              .map(p => ({
                name: p.username,
                coins: p.coins,
                wins: p.wins,
                played: p.played,
                score: p.score
              }))
          )
        );

        const list = $("modalBody").querySelector("div");
        if (list) {
          list.innerHTML = (data.players || [])
            .map((p, i) => rankRow({
              name: p.username,
              wins: p.wins,
              played: p.played,
              score: p.score
            }, i))
            .join("");
        }
      })
      .catch(error => toast(error.message, "bad"));
  }
};

hmaraSync();
</script>
</body>
</html>
